[project]
name = "scrape-data"
version = "0.1.0"
description = "Scrape pose images from Pinterest & Google, deduplicate with Blake2b, filter by YOLOv11 person detection"
requires-python = ">=3.11"
dependencies = [
    # scraping
    "gallery-dl>=1.26",
    "httpx[http2]>=0.27",
    "tenacity>=8.2",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    # vision / ML
    "ultralytics>=8.3",
    "opencv-python>=4.8",
    # config / utils
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[project.scripts]
scrape = "scrape_data.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrape_data"]

[tool.uv]
dev-dependencies = []
